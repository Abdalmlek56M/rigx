services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hardware_store}
      POSTGRES_USER: ${POSTGRES_USER:-hardware_store}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: src/Host/HardwareStore.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-hardware_store};Username=hardware_store_app;Password=${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      DataProtection__KeyRingPath: /home/app/.local/share/HardwareStore/DataProtection/Development
      Catalog__MediaRoot: /app/App_Data/catalog-media
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - api_data_protection:/home/app/.local/share/HardwareStore/DataProtection/Development
      - api_data_catalog_media:/app/App_Data/catalog-media
    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data:
  api_data_protection:
  api_data_catalog_media:
