# RIGX on the shared VPS: one server block in the existing host nginx (it already owns ports 80 and 443).
# Install: /etc/nginx/sites-available/rigxhardware.com, symlink into sites-enabled, `sudo nginx -t`, `sudo systemctl reload nginx`.
# Traffic: visitor → Cloudflare (proxied, SSL "Full (strict)") → this nginx with the Cloudflare Origin certificate
#          → the RIGX containers on loopback ports (API 8081, web 3001; change both here and in deploy/.env if taken).
# Ubuntu 24.04 ships nginx 1.24, so HTTP/2 is turned on in the `listen` line.

upstream rigx_web { server 127.0.0.1:3001; keepalive 16; }
upstream rigx_api { server 127.0.0.1:8081; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name rigxhardware.com www.rigxhardware.com;
    return 301 https://rigxhardware.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.rigxhardware.com;
    ssl_certificate     /etc/ssl/rigx/origin.pem;
    ssl_certificate_key /etc/ssl/rigx/origin.key;
    return 301 https://rigxhardware.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rigxhardware.com;

    ssl_certificate     /etc/ssl/rigx/origin.pem;
    ssl_certificate_key /etc/ssl/rigx/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The real visitor address comes from Cloudflare (rate limits, sign-in alerts, audit log).
    include /etc/nginx/snippets/rigx-cloudflare-real-ip.conf;

    # Photos are up to 12 MB; the stock import file up to 2 MB.
    client_max_body_size 15m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/rigx.access.log;
    error_log  /var/log/nginx/rigx.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;

    # The browser talks to the API on the same origin (__Host- cookies + CSRF token).
    location /api/ {
        proxy_pass http://rigx_api;
    }

    # Uptime check (Sentry): API + database.
    location = /health {
        access_log off;
        proxy_pass http://rigx_api/health/ready;
    }

    location / {
        proxy_pass http://rigx_web;
    }
}
